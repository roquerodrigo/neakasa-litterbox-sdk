[project]
name = "neakasa-litterbox-sdk"
version = "0.2.0"
description = "Python SDK for Neakasa M1 cat litter box"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rodrigo Roque", email = "rodrigogoncalvesroque@gmail.com" }]
keywords = ["neakasa", "iot", "smart-home", "litter-box", "homeassistant", "aliyun"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = [
    "aiohttp>=3.13.5",
    "aiomqtt>=2.5.1",
    "cryptography>=44.0",
]

[project.urls]
Repository = "https://github.com/roquerodrigo/neakasa-litterbox-sdk"
Issues = "https://github.com/roquerodrigo/neakasa-litterbox-sdk/issues"

[build-system]
# Pin below 1.28: hatchling 1.28+ emits Metadata-Version 2.5, which the
# twine bundled in the PyPI publish action rejects ("'2.5' is not a valid
# metadata version"), breaking the release. 1.27 emits 2.4, which passes.
requires = ["hatchling>=1.27,<1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neakasa_litterbox_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--cov=src/neakasa_litterbox_sdk",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "python-dotenv>=1.0",
    "certifi>=2024.0",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.3.0",
]
lint = [
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
default-groups = ["dev", "lint"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.format]
exclude = ["*.md"]  # ruff 0.16 formats Python blocks in Markdown; docs keep their own layout

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
    "TC",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"examples/*" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unreachable = true
warn_unused_ignores = true
disallow_any_explicit = true
