[project]
name = "neakasa-litterbox-sdk"
version = "0.2.1"
description = "Python SDK for Neakasa M1 cat litter box"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rodrigo Roque", email = "rodrigogoncalvesroque@gmail.com" }]
keywords = ["neakasa", "iot", "smart-home", "litter-box", "homeassistant", "aliyun"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = [
    "aiohttp>=3.13.5",
    "aiomqtt>=2.5.1",
    "cryptography>=44.0",
]

[project.urls]
Repository = "https://github.com/roquerodrigo/neakasa-litterbox-sdk"
Issues = "https://github.com/roquerodrigo/neakasa-litterbox-sdk/issues"

[build-system]
# Pin below 1.28: hatchling 1.28+ emits Metadata-Version 2.5, which the
# twine bundled in the PyPI publish action rejects ("'2.5' is not a valid
# metadata version"), breaking the release. 1.27 emits 2.4, which passes.
requires = ["hatchling>=1.27,<1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neakasa_litterbox_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--cov=src/neakasa_litterbox_sdk",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "python-dotenv>=1.0",
    "certifi>=2024.0",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.3.0",
]
lint = [
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
default-groups = ["dev", "lint"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.format]
exclude = ["*.md"]  # ruff 0.16 formats Python blocks in Markdown; docs keep their own layout

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Conflict with the formatter.
    "COM812",  # missing-trailing-comma
    "ISC001",  # single-line-implicit-string-concatenation
    "D203",    # incorrect-blank-line-before-class
    "D212",    # multi-line-summary-first-line
    # Deliberate project conventions (see CODE_STYLE.md).
    "CPY001",  # this project ships no per-file copyright headers
    "ANN401",  # typing.Any is already banned outright by mypy
    "TID252",  # same-package relative imports are the documented default
    "D105",    # magic methods are covered by the class docstring
    "D107",    # __init__ is covered by the class docstring
    # Error messages are built at the raise site in the documented
    # "Failed to <verb> <object>: <cause>" shape, which needs the runtime
    # values; hoisting them into per-message exception classes or local
    # variables would obscure the one convention every error follows.
    "EM101",   # raw-string-in-exception
    "EM102",   # f-string-in-exception
    "TRY003",  # raise-vanilla-args
    # The command surface is a public API whose booleans are documented as
    # positional (``set_child_lock(device_name, True)``); forcing them
    # keyword-only would break every caller.
    "FBT001",  # boolean-type-hint-positional-argument
    "FBT002",  # boolean-default-value-positional-argument
    "FBT003",  # boolean-positional-value-in-call
    # A background supervisory task has to survive every failure mode it can
    # be handed: an exception escaping one kills the task and leaves the
    # consumer waiting on a stream nobody is watching any more.
    "BLE001",  # blind-except
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.pylint]
# The signing helpers take the full request tuple (method, path, body,
# headers, timestamp, credentials); splitting it into a parameter object
# would only move the same values one level down.
max-args = 8

[tool.ruff.lint.per-file-ignores]
# Both functions are flat dispatch tables over the wire's property names:
# the branch count *is* the mapping, and splitting it hides it.
"src/neakasa_litterbox_sdk/models/status_update.py" = ["C901", "PLR0912"]
"src/neakasa_litterbox_sdk/status_stream.py" = ["C901", "PLR0911", "PLR0912"]
# The JSON boundary answers malformed input and a non-object top level with
# the same ValueError, so callers need to catch only one type.
"src/neakasa_litterbox_sdk/utils/_json.py" = ["TRY004"]
"tests/*" = [
    "S101",     # assert is the point of a test
    "S105",     # synthetic credentials in fixtures
    "S106",
    "S107",
    "D",        # tests document themselves through their names
    "ANN",      # fixtures and lambdas carry no annotations
    "ARG",      # doubles must match the real signature they stand in for
    "SLF001",   # asserting on private state is intentional here
    "PLC0415",  # local imports keep heavy fixtures out of collection
    "PLR2004",  # literals in assertions are the expected values
    "PYI034",   # test doubles are not part of the typed public surface
]
"examples/*" = [
    "D",        # scripts explain themselves in their module docstring
    "T201",     # print is the output of a runnable example
    "INP001",   # examples/ is a script folder, not a package
    "PLR2004",  # literals inline keep an example readable
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unreachable = true
warn_unused_ignores = true
disallow_any_explicit = true
